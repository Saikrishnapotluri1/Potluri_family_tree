<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Potluri Family Tree</title>
<style>
  body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
  .tree-container { width: 100%; overflow-x: auto; padding-bottom: 50px; }
  .tree ul { padding-top: 20px; position: relative; transition: all 0.5s; display: flex; justify-content: center; padding-left: 0; min-width: max-content; }
  .tree li { float: left; text-align: center; list-style-type: none; position: relative; padding: 20px 5px 0 5px; transition: all 0.5s; }
  .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid #ccc; width: 50%; height: 20px; }
  .tree li::after { right: auto; left: 50%; border-left: 2px solid #ccc; }
  .tree li:only-child::after, .tree li:only-child::before { display: none; }
  .tree li:only-child { padding-top: 0; }
  .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
  .tree li:first-child::after { border-radius: 5px 0 0 0; }
  .tree li:last-child::before { border-right: 2px solid #ccc; border-radius: 0 5px 0 0; }
  .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #ccc; width: 0; height: 20px; }
  
  .node { text-decoration: none; color: #333; display: inline-block; padding: 15px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; transition: all 0.3s ease; min-width: 150px; }
  .node:hover { background: #e0f7fa; transform: scale(1.05); }
  .couple { display: flex; justify-content: center; gap: 15px; }
  .person { display: flex; flex-direction: column; align-items: center; width: 80px; }
  .person img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 3px solid #4CAF50; margin-bottom: 8px; background-color: #ddd; }
  .name { display: block; font-weight: bold; font-size: 13px; line-height: 1.2; }
  .title { display: block; font-size: 11px; color: #888; margin-top: 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="tree-container">
  <div class="tree" id="family-tree-box"></div>
</div>

<script>
  // ==========================================
  // DATA FROM Potluri_family_tree.xlsx
  // ==========================================
  
  const excelData = [
    { name: "Potluri Seetaramaiah", parent: "", photo: "", spouse: "Potluri Seetamma", spousePhoto: "" },
    { name: "Potluri Madhav Rao", parent: "Potluri Seetaramaiah", photo: "Potluri_Madhav_Rao.jpg", spouse: "Atluri Swarajyam", spousePhoto: "Atluri_Swarajyam.jpg" },
    { name: "Potluri Ramatulasi", parent: "Potluri Madhav Rao", photo: "", spouse: "Atluri Kishtarao", spousePhoto: "" },
    { name: "Potluri Venkateswara rao", parent: "Potluri Madhav Rao", photo: "Potluri_Venkateswara_rao.jpg", spouse: "Myneni Saralakumari", spousePhoto: "Myneni_Saralakumari.jpg" },
    { name: "Potluri Rangarao (Bujji)", parent: "Potluri Madhav Rao", photo: "", spouse: "Bhagyalakshmi", spousePhoto: "Bhagyalakshmi_Baby.jpg" },
    { name: "Potluri Seethaiah", parent: "Potluri Madhav Rao", photo: "", spouse: "", spousePhoto: "" },
    { name: "Potluri Sheshagiri", parent: "Potluri Madhav Rao", photo: "", spouse: "", spousePhoto: "" },
    { name: "Potluri Rani", parent: "Potluri Madhav Rao", photo: "", spouse: "", spousePhoto: "" },
    { name: "Potluri Yeramma", parent: "Potluri Madhav Rao", photo: "", spouse: "", spousePhoto: "" },
    { name: "Potluri Budamma", parent: "Potluri Madhav Rao", photo: "", spouse: "", spousePhoto: "" },
    { name: "Potluri Srinivas", parent: "Potluri Venkateswara rao", photo: "", spouse: "Potluri Anita", spousePhoto: "" },
    { name: "Potluri Ram Prasad", parent: "Potluri Venkateswara rao", photo: "", spouse: "Myneni Parvathi", spousePhoto: "" },
    { name: "Potluri Bhargav", parent: "Potluri Srinivas", photo: "", spouse: "", spousePhoto: "" },
    { name: "Potluri Karthik", parent: "Potluri Srinivas", photo: "", spouse: "", spousePhoto: "" },
    { name: "Potluri Sai Krishna", parent: "Potluri Ram Prasad", photo: "", spouse: "", spousePhoto: "" },
    { name: "Atluri Srinivas", parent: "Atluri Kishtarao", photo: "", spouse: "Jyothi", spousePhoto: "" },
    { name: "Alla chinamma", parent: "Atluri Kishtarao", photo: "", spouse: "Alla KrishnaRao", spousePhoto: "" },
    { name: "Potluri Janardhan", parent: "Potluri Rangarao (Bujji)", photo: "", spouse: "Jansi rani", spousePhoto: "" },
    { name: "Potluri Lakshmi", parent: "Potluri Rangarao (Bujji)", photo: "", spouse: "Satyanarayana", spousePhoto: "" },
    { name: "Potluri Raghavendra", parent: "Potluri Rangarao (Bujji)", photo: "", spouse: "", spousePhoto: "" }
  ];

  // ==========================================
  // THE ENGINE
  // ==========================================
  
  function buildTree(data) {
    let map = {};
    let roots = [];
    data.forEach(node => { map[node.name] = { ...node, children: [] }; });
    data.forEach(node => {
      if (node.parent && map[node.parent]) {
        map[node.parent].children.push(map[node.name]);
      } else {
        roots.push(map[node.name]); 
      }
    });
    return roots;
  }

  function createHTML(node) {
    let html = '<li>';
    let hasChildren = node.children && node.children.length > 0;
    let clickCode = hasChildren ? 'onclick="toggleFamily(this)"' : '';
    let titleCode = hasChildren ? '<span class="title">Click for family</span>' : '';

    html += `<div class="node" ${clickCode}>
              <div class="couple">
                <div class="person">
                  <img src="${node.photo || 'placeholder.jpg'}" alt="${node.name}">
                  <span class="name">${node.name}</span>
                </div>`;

    if (node.spouse) {
      html += ` <div class="person">
                  <img src="${node.spousePhoto || 'placeholder.jpg'}" alt="${node.spouse}">
                  <span class="name">${node.spouse}</span>
                </div>`;
    }

    html += `  </div>${titleCode}</div>`;

    if (hasChildren) {
      html += '<ul class="hidden">';
      node.children.forEach(child => { html += createHTML(child); });
      html += '</ul>';
    }
    html += '</li>';
    return html;
  }

  const familyTree = buildTree(excelData);
  let finalHTML = '<ul>';
  familyTree.forEach(rootPerson => { finalHTML += createHTML(rootPerson); });
  finalHTML += '</ul>';

  document.getElementById('family-tree-box').innerHTML = finalHTML;

  function toggleFamily(element) {
    let nextUl = element.nextElementSibling;
    if (nextUl && nextUl.tagName === 'UL') {
      nextUl.classList.toggle('hidden');
    }
  }
</script>

</body>
</html>
